[project]
name = "pathointelligence"
version = "0.1.0"
description = "AI-assisted histopathology cancer detection: CNN classification, Grad-CAM explainability, LLM-generated reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "python-multipart>=0.0.12",
    "anthropic>=0.40",
]

[project.scripts]
pathointelligence = "pathointelligence:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
# ML training/experimentation stack — not needed to run the API in prod.
ml = [
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0",
    "albumentations>=1.4",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "mlflow>=2.17",
    "opencv-python-headless>=4.10",
    "h5py>=3.16.0",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
